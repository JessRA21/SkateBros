<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        h1 { text-align: center; color: #333; }
        .catalogo { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .producto { background: white; border-radius: 8px; padding: 15px; width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .producto img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .precio { color: #007BFF; font-weight: bold; margin: 10px 0; }
        .btn { display: inline-block; padding: 8px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Catálogo de Productos</h1>
    
    <div class="catalogo">
        <div class="producto">
            <img src="https://placeholder.com" alt="Producto 1">
            <h3>Camisa básica</h3>
            <p class="precio">$250.00</p>
            <a href="#" class="btn">Ver detalle</a>
        </div>
        
        <div class="producto">
            <img src="https://placeholder.com" alt="Producto 2">
            <h3>Pantalón de lino</h3>
            <p class="precio">$450.00</p>
            <a href="#" class="btn">Ver detalle</a>
        </div>
    </div>

</body>
</html>
