<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkateBros - Lijas</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="catalogo" class="catalog-section">
        <div class="container">
          <!-- Título con estilo de dos colores -->
          <h2 class="section-title">NUESTRAS <span class="highlight">LIJAS</span></h2>
          
          <div class="product-grid" id="product-grid">
            <!-- Tarjeta 1 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/lija1.jpg" alt="Lija Independient" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Lija Independient</h3>
                <p class="product-price">$340 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="1" data-name="Lija Independient" data-price="340">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <!-- Tarjeta 2 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/lija2.jpg" alt="Lija Thrasher" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Lija Thrasher</h3>
                <p class="product-price">$350 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="2" data-name="Lija Thrasher" data-price="350">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <!-- Tarjeta 3 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/lija3.png" alt="Lija Thrasher Flame" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Lija Thrasher Flame</h3>
                <p class="product-price">$350 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="3" data-name="Lija Thrasher Flame" data-price="350">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <!-- Tarjeta 4 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/lija4.jpg" alt="Lija Grizzly" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Lija Grizzly</h3>
                <p class="product-price">$400 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="4" data-name="Lija Grizzly" data-price="400">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
          </div>
        </div>
      </section>
    </main>

    <!-- Contenedor para el Footer dinámico -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/ShoppingCart.js"></script>
    <script>
      async function loadComponent(id, file) {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
        lucide.createIcons(); 
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadComponent("header-placeholder", "header.html");
        await loadComponent("footer-placeholder", "footer.html");
      });
    </script>
  </body>
</html>
