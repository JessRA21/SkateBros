<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkateBros - Tablas</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="catalogo" class="catalog-section">
        <div class="container">
          <h2 class="section-title">NUESTRAS <span class="highlight">TABLAS</span></h2>
          
          <div class="product-grid" id="product-grid">
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla1.png" alt="Tabla Cyberpunk" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Cyberpunk</h3>
                <p class="product-price">$650 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="tab-1" data-name="Tabla Cyberpunk" data-price="650">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla2.jpg" alt="Tabla Zero" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Zero</h3>
                <p class="product-price">$600 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="tab-2" data-name="Tabla Zero" data-price="600">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla4.jpg" alt="Tabla Sanrio" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Sanrio</h3>
                <p class="product-price">$600 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="tab-3" data-name="Tabla Sanrio" data-price="600">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla3.jpg" alt="Tabla Punk" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Punk</h3>
                <p class="product-price">$550 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="tab-4" data-name="Tabla Punk" data-price="550">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla5.jpg" alt="Tabla Sanrio Kitty" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Sanrio Kitty</h3>
                <p class="product-price">$650 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="tab-5" data-name="Tabla Sanrio Kitty" data-price="650">
                  Agregar al carrito
                </button>
              </div>
            </article>
          </div>
        </div>
      </section>

      <!-- CARRITO SLIDE-OVER -->
       
      <aside id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
          <h2>Tu Carrito</h2>
          <button id="close-cart-btn" class="close-btn">&times;</button>
        </div>
        <div class="cart-body" id="cart-items">
          <p class="empty-msg">Tu carrito está vacío.</p>
        </div>
        <div class="cart-footer">
          <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-price">$0 MXN</span>
          </div>
          <button id="checkout-button" class="btn btn-primary btn-block">Finalizar Compra</button>
        </div>
      </aside>
      <div id="cart-overlay" class="cart-overlay"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/ShoppingCart.js"></script>
    <script>
      async function loadComponent(id, file) {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
        lucide.createIcons();
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadComponent("header-placeholder", "header.html");
        await loadComponent("footer-placeholder", "footer.html");
      });
    </script>
  </body>
</html>
