<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkateBros - Tablas</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="catalogo" class="catalog-section">
        <div class="container">
          <!-- Título con el mismo estilo de dos colores del catálogo principal -->
          <h2 class="section-title">NUESTRAS <span class="highlight">TABLAS</span></h2>
          
          <div class="product-grid" id="product-grid">
            <!-- Tarjeta 1 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla1.png" alt="Tabla Cyberpunk" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Cyberpunk</h3>
                <p class="product-price">$650 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="1" data-name="Tabla Cyberpunk" data-price="650">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <!-- Tarjeta 2 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla2.jpg" alt="Tabla Zero" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Zero</h3>
                <p class="product-price">$600 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="2" data-name="Tabla Zero" data-price="600">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <!-- Tarjeta 3 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla4.jpg" alt="Tabla Sanrio" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Sanrio</h3>
                <p class="product-price">$600 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="3" data-name="Tabla Sanrio" data-price="600">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <!-- Tarjeta 4 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla3.jpg" alt="Tabla Punk" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Punk</h3>
                <p class="product-price">$550 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="4" data-name="Tabla Punk" data-price="550">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <!-- Tarjeta 5 -->
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/tabla5.jpg" alt="Tabla Sanrio Kitty" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Tabla Sanrio Kitty</h3>
                <p class="product-price">$650 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="5" data-name="Tabla Sanrio Kitty" data-price="650">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
          </div>
        </div>
      </section>
    </main>

    <!-- Contenedor para el Footer dinámico -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/ShoppingCart.js"></script>
    <script>
      async function loadComponent(id, file) {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
        lucide.createIcons(); // Renderiza los íconos cargados dinámicamente
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadComponent("header-placeholder", "header.html");
        await loadComponent("footer-placeholder", "footer.html");
      });
    </script>
  </body>
</html>
