<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkateBros - Ruedas y Baleros</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="catalogo" class="catalog-section">
        <div class="container">
          <h2 class="section-title">RUEDAS Y <span class="highlight">BALEROS</span></h2>
          
          <div class="product-grid" id="product-grid">
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/wheel1.jpg" alt="Ruedas Powell Peralta G-Bones (Black)" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Ruedas Powell Peralta G-Bones (Black)</h3>
                <p class="product-price">$1200 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="rued-1" data-name="Ruedas Powell Peralta G-Bones (Black)" data-price="1200">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/wheel2.jpg" alt="Ruedas Spitfire Formula 4" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Ruedas Spitfire Formula 4</h3>
                <p class="product-price">$1200 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="rued-2" data-name="Ruedas Spitfire Formula 4" data-price="1200">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/wheel3.jpg" alt="Ruedas Longboard" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Ruedas Longboard</h3>
                <p class="product-price">$1300 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="rued-3" data-name="Ruedas Longboard" data-price="1300">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/wheel4.jpg" alt="Ruedas Clasfox" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Ruedas Clasfox</h3>
                <p class="product-price">$1200 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="rued-4" data-name="Ruedas Clasfox" data-price="1200">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/rod1.jpg" alt="Baleros Independient" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Baleros Independient</h3>
                <p class="product-price">$320 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="rued-5" data-name="Baleros Independient" data-price="320">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/rod2.jpg" alt="Baleros Spitfire Burners" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Baleros Spitfire Burners</h3>
                <p class="product-price">$500 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="rued-6" data-name="Baleros Spitfire Burners" data-price="500">
                  Agregar al carrito
                </button>
              </div>
            </article>
          </div>
        </div>
      </section>

      <!-- CARRITO SLIDE-OVER -->
       
      <aside id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
          <h2>Tu Carrito</h2>
          <button id="close-cart-btn" class="close-btn">&times;</button>
        </div>
        <div class="cart-body" id="cart-items">
          <p class="empty-msg">Tu carrito está vacío.</p>
        </div>
        <div class="cart-footer">
          <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-price">$0 MXN</span>
          </div>
          <button id="checkout-button" class="btn btn-primary btn-block">Finalizar Compra</button>
        </div>
      </aside>
      <div id="cart-overlay" class="cart-overlay"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/ShoppingCart.js"></script>
    <script>
      async function loadComponent(id, file) {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
        lucide.createIcons();
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadComponent("header-placeholder", "header.html");
        await loadComponent("footer-placeholder", "footer.html");
      });
    </script>
  </body>
</html>
