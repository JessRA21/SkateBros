<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito | SkateBros</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      /* Estilos propios de esta página */
      .cart-page {
        min-height: 70vh;
      }
      .cart-layout {
        max-width: 1000px;
        margin: 0 auto;
        padding: 4rem 2rem;
      }
      .cart-box {
        background: var(--color-black);
        border: 1px solid #282828;
        border-radius: 8px;
        padding: 1.5rem;
      }
      .cart-row {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        align-items: center;
        gap: 1rem;
        padding: 1rem 0;
        border-bottom: 1px solid #282828;
      }
      .cart-row h3 {
        font-size: 1rem;
      }
      .cart-row p {
        color: var(--color-orange);
        font-weight: bold;
      }
      .quantity-button,
      .remove-button {
        background: transparent;
        color: var(--color-white);
        border: 1px solid var(--color-orange);
        border-radius: 4px;
        cursor: pointer;
        padding: 0.25rem 0.55rem;
      }
      .quantity {
        margin: 0 0.5rem;
      }
      .remove-button {
        color: #ff8b8b;
        border-color: #ff8b8b;
      }
      .cart-summary {
        text-align: right;
        padding-top: 1.5rem;
      }
      .cart-summary h2 {
        margin-bottom: 1rem;
      }
      .empty-cart {
        text-align: center;
        color: var(--color-light-gray);
        padding: 2rem;
      }
      @media (max-width: 650px) {
        .cart-row {
          grid-template-columns: 1fr auto;
        }
        .cart-row .price,
        .cart-row .remove-button {
          justify-self: end;
        }
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <a href="index.html" class="logo"
          ><span class="logo-accent">Skate</span>Bros</a
        >
        <nav>
          <a href="index.html#catalogo" class="nav-link">Volver al catálogo</a>
        </nav>
      </div>
    </header>

    <main class="cart-page">
      <div class="cart-layout">
        <h1 class="section-title">MI <span class="highlight">CARRITO</span></h1>
        <section class="cart-box">
          <div id="cart-items"></div>
          <div class="cart-summary">
            <h2>
              Total: <span id="cart-total" class="highlight">$0 MXN</span>
            </h2>
            <a href="ShoppingCart.html" id="checkout-button" class="btn btn-primary">
              Finalizar compra
            </a>
          </div>
        </section>
      </div>
    </main>

    <footer class="main-footer">
      <div class="footer-bottom">
        <p>&copy; 2026 SkateBros. Todos los derechos reservados.</p>
      </div>
    </footer>

    <script src="assets/js/ShoppingCart.js"></script>
  </body>
</html>
