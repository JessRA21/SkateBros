<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkateBros - Trucks</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="catalogo" class="catalog-section">
        <div class="container">
          <h2 class="section-title">NUESTROS <span class="highlight">TRUCKS</span></h2>
          
          <div class="product-grid" id="product-grid">
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/truck1.png" alt="Trucks Independient" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Trucks Independient</h3>
                <p class="product-price">$1250 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="truck-1" data-name="Trucks Independient" data-price="1250">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/truck2.jpg" alt="Trucks Spitfire" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Trucks Spitfire</h3>
                <p class="product-price">$1500 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="truck-2" data-name="Trucks Spitfire" data-price="1500">
                  Agregar al carrito
                </button>
              </div>
            </article>

            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/truck3.jpg" alt="Trucks Thunder" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Trucks Thunder</h3>
                <p class="product-price">$1600 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="truck-3" data-name="Trucks Thunder" data-price="1600">
                  Agregar al carrito
                </button>
              </div>
            </article>
            
            <article class="product-card">
              <div class="product-img-wrapper">
                <img src="assets/images/products/truck4.jpg" alt="Trucks Element" class="product-img">
              </div>
              <div class="product-info">
                <h3 class="product-name">Trucks Element</h3>
                <p class="product-price">$800 MXN</p>
                <button class="btn btn-secondary add-to-cart-btn" data-id="truck-4" data-name="Trucks Element" data-price="800">
                  Agregar al carrito
                </button>
              </div>
            </article>
          </div>
        </div>
      </section>

      <!-- CARRITO SLIDE-OVER -->
       
      <aside id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
          <h2>Tu Carrito</h2>
          <button id="close-cart-btn" class="close-btn">&times;</button>
        </div>
        <div class="cart-body" id="cart-items">
          <p class="empty-msg">Tu carrito está vacío.</p>
        </div>
        <div class="cart-footer">
          <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-price">$0 MXN</span>
          </div>
          <button id="checkout-button" class="btn btn-primary btn-block">Finalizar Compra</button>
        </div>
      </aside>
      <div id="cart-overlay" class="cart-overlay"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/ShoppingCart.js"></script>
    <script>
      async function loadComponent(id, file) {
        const response = await fetch(file);
        const text = await response.text();
        document.getElementById(id).innerHTML = text;
        lucide.createIcons();
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadComponent("header-placeholder", "header.html");
        await loadComponent("footer-placeholder", "footer.html");
      });
    </script>
  </body>
</html>
